const $main=$('main');
$main.addEventListener('click',e=>{
  const t=e.target, at=s=>t.closest(s);
  let b;
  /* --- inventario --- */
  if(b=at('[data-st]')){
    const up=b.dataset.st==='+';
    cambiarConteo(b.dataset.sku, v=> up ? (v==null?1:v+1) : (v==null?0:Math.max(0,v-1)));
    return;
  }
  if(b=at('[data-pk]')){
    const p=prodSku(b.dataset.pk); if(!p) return;
    const f=n(p.fmtUds,1)||1; cambiarConteo(p.sku, v=>(v||0)+f); return;
  }
  if(b=at('[data-rowmenu]')){ menuConteo(b.dataset.rowmenu); return; }
  if(b=at('[data-zona]')){ abrirZona(b.dataset.zona); return; }
  if(at('[data-invback]')){ salirZona(); return; }
  if(at('[data-ocultar]')){ ui.ocultar=!ui.ocultar; render(); return; }
  if(b=at('[data-mesn]')){ ui.mesNuevo=b.dataset.mesn; render(); return; }
  if(at('[data-empezar]')){ empezarInv(); return; }
  if(at('[data-enviar]')){ enviarParte(); return; }
  if(at('[data-recibir]')){ hojaRecibir(); return; }
  if(at('[data-cerrarinv]')){ hojaCerrar(); return; }
  if(at('[data-descartar]')){
    const inv=invAbierto(CFG.local); if(!inv) return;
    confirmar('¿Descartar el inventario?','Se borra todo lo contado en '+inv.local+' para '+mesNombre(inv.mes)+'. No se puede deshacer.',()=>{
      I=I.filter(x=>x!==inv); guardar(); cerrarSheet(); render(); toast('Inventario descartado');
    },'Descartar');
    return;
  }
  if(at('[data-nombre]')){ pedirNombre(); return; }
  if(b=at('[data-xls]')){ bajarInforme(b.dataset.xls); return; }
  if(b=at('[data-xlsshare]')){ compartirInforme(b.dataset.xlsshare); return; }
  if(b=at('[data-mesdet]')){ hojaMes(b.dataset.mesdet); return; }
  if(at('[data-mas]')){ ui.lim+=100; render(); return; }

  /* --- stock / catálogo --- */
  if(b=at('[data-open]')){ fichaProducto(b.dataset.open); return; }
  if(b=at('[data-est]')){ ui.estado=b.dataset.est; ui.lim=60; render(); return; }
  if(b=at('[data-sel]')){
    const k=b.dataset.sel; if(ui.seleccion[k]) delete ui.seleccion[k]; else ui.seleccion[k]=true;
    render(); return;
  }
  /* --- pedido --- */
  if(b=at('[data-q]')){
    const sku=b.dataset.sku, paso=b.dataset.q==='+'?1:-1;
    const x=conCalc().find(y=>y.p.sku===sku); if(!x) return;
    const f=n(x.p.fmtUds,1)||1;
    ui.pedido[sku]=Math.max(0, udsPedido(x)+paso*f); render(); return;
  }
  if(at('[data-merma]')){ hojaMerma(); return; }
  if(at('[data-albaran]')){ hojaAlbaran(); return; }
  if(at('[data-enviartodos]')){
    const provs=[...new Set(conCalc().filter(x=>x.estado==='PEDIR'||x.estado==='SIN STOCK').map(x=>x.p.prov))].sort();
    mostrarTexto('Todos los pedidos', provs.map(textoPedido).join('\n\n────────\n\n'), 'Un bloque por proveedor', true); return;
  }
  if(b=at('[data-copiar]')){
    const prov=b.dataset.copiar;
    mostrarTexto('Pedido a '+prov, textoPedido(prov), 'Pégalo en WhatsApp, correo o el portal del proveedor', true); return;
  }
  if(b=at('[data-recibir-ped]')){
    const pr=b.dataset.recibirPed, L=CFG.local;
    const pend=conCalc().filter(x=>x.p.prov===pr && (x.estado==='PEDIR'||x.estado==='SIN STOCK') && udsPedido(x)>0);
    confirmar('Marcar recibido de '+pr,'Se registran '+pend.length+' entradas en '+L+' con las cantidades de la lista.',()=>{
      pend.forEach(x=>addMov(x.p.sku,'Entrada',udsPedido(x),'Pedido '+pr,hoyISO(),L));
      pend.forEach(x=>delete ui.pedido[x.p.sku]);
      cerrarSheet(); render(); toast(pend.length+' entradas registradas en '+L);
    },'Registrar',false);
    return;
  }
  if(t.id==='nuevo'){ editorProducto(null); return; }
  if(t.id==='mover'){ moverSeleccion(); return; }
  if(t.id==='limpiarsel'){ ui.seleccion={}; render(); return; }
  if(t.id==='borrarsel'){
    const ks=Object.keys(ui.seleccion).filter(k=>ui.seleccion[k]);
    confirmar('¿Borrar '+ks.length+' referencias?','Se eliminan también sus movimientos. No se puede deshacer.',()=>{
      P=P.filter(p=>!ui.seleccion[p.sku]); M=M.filter(m=>!ui.seleccion[m.sku]);
      ui.seleccion={}; invalidar(); guardar(); cerrarSheet(); render(); toast(ks.length+' referencias borradas');
    },'Borrar');
    return;
  }
  /* --- más --- */
  if(b=at('[data-delmov]')){
    M=M.filter(x=>x.id!==b.dataset.delmov); invalidar(); guardar(); render(); toast('Movimiento borrado'); return;
  }
  if(t.closest('#t_pitido')){ CFG.pitido=!CFG.pitido; guardar(); render(); if(CFG.pitido) pitido('ok'); return; }
  if(t.id==='expjson'){ descargarBlob('stock-copia-'+hoyISO()+'.json', new Blob([copiaJSON()],{type:'application/json'})); return; }
  if(t.id==='sharecat'){ compartirArchivo('stock-catalogo-'+hoyISO()+'.json', new Blob([catalogoJSON()],{type:'application/json'})); return; }
  if(t.id==='guardarloc'){
    document.querySelectorAll('[data-nomloc]').forEach(i=>{ const v=i.value.trim(); if(v) NOMLOC[i.dataset.nomloc]=v; else delete NOMLOC[i.dataset.nomloc]; });
    guardar(); render(); toast('Nombres guardados'); return;
  }
  if(t.id==='impjson'){ $('fileimp').value=''; $('fileimp').click(); return; }
  if(t.id==='expcat'){
    const f=[['SKU','Producto','Categoria','Proveedor','Ref proveedor','Unidad','Formato','Uds por formato','Precio coste','Plazo','Cobertura']
      .concat(...LIDS.map(L=>['Se usa '+L,'Consumo/dia '+L,'Stock '+L]))];
    P.forEach(p=>f.push([p.sku,p.nombre,p.cat,p.prov,p.ref,p.unidad,p.fmtNombre,p.fmtUds,p.precio,p.plazo,p.cobertura]
      .concat(...LIDS.map(L=>[usaEn(p,L)?'si':'no', cfgL(p,L).consumo, r3(stocks(L)[p.sku]||0)]))));
    descargar('catalogo-'+hoyISO()+'.csv', csv(f)); return;
  }
  if(t.id==='expmov'){
    const idx={}; P.forEach(p=>idx[p.sku]=p);
    const g=[['Fecha','Local','SKU','Producto','Proveedor','Tipo','Cantidad','Nota']];
    M.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(m=>{
      const p=idx[m.sku]||{}; g.push([m.fecha,m.local,m.sku,p.nombre||'',p.prov||'',m.tipo,n(m.cant),m.nota]);
    });
    descargar('movimientos-'+hoyISO()+'.csv', csv(g)); return;
  }
  if(t.id==='compactar'){
    confirmar('Cerrar histórico','Los movimientos se sustituyen por un saldo inicial por referencia y local con la fecha de hoy. El stock no cambia, pero se pierde el detalle. Descarga una copia antes si lo quieres conservar.',()=>{
      const nuevos=[];
      LIDS.forEach(L=>{ const s=stocks(L); Object.keys(s).forEach(sku=>{
        if(Math.abs(s[sku])>0.0001) nuevos.push({id:uid(),fecha:hoyISO(),sku,tipo:'Entrada',cant:r3(s[sku]),nota:'Saldo inicial',local:L});
      }); });
      M=nuevos; invalidar(); guardar(); cerrarSheet(); render(); toast('Histórico cerrado');
    });
    return;
  }
  if(t.id==='reset'){
    confirmar('Restablecer todo','Se borran catálogo, movimientos e inventarios y se vuelve al catálogo de ejemplo. No se puede deshacer.',()=>{
      P=semilla(); M=[]; I=[]; NOMLOC={}; ui.pedido={}; ui.seleccion={};
      invalidar(); guardar(); cerrarSheet(); render(); toast('Sistema restablecido');
    },'Restablecer');
    return;
  }
});

$main.addEventListener('change',e=>{
  const t=e.target; ui.lim=60;
  if(t.id==='fprov'){ ui.prov=t.value; render(); }
  if(t.id==='fcat'){ ui.cat=t.value; render(); }
});
$main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.qi!=null){ const v=leerNum(t.value); ui.pedido[t.dataset.qi]=Math.max(0,(v==null||isNaN(v))?0:v); }
  if(t.dataset.cnt!=null){
    const inv=invAbierto(CFG.local); if(!inv) return;
    const v=leerNum(t.value);
    if(v==null) setConteo(inv, t.dataset.cnt, null);
    else if(!isNaN(v)) setConteo(inv, t.dataset.cnt, v);
    pintarFila(t.dataset.cnt, false);
  }
});
/* Intro en el teclado → siguiente producto, como bajar por la hoja de papel */
$main.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key!=='Enter' || t.dataset.cnt==null) return;
  e.preventDefault();
  const all=[...document.querySelectorAll('[data-cnt]')], i=all.indexOf(t);
  if(i>-1 && i<all.length-1){
    const nx=all[i+1]; nx.focus(); try{ nx.select(); }catch(err){}
    nx.closest('.crow').scrollIntoView({block:'center', behavior:'smooth'});
  } else { t.blur(); toast('Fin de la lista'); }
});
$main.addEventListener('focusin',e=>{
  const t=e.target; if(t.dataset.cnt!=null){ try{ t.select(); }catch(err){} }
});
$('fileimp').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>restaurar(String(r.result)); r.readAsText(f);
});

/* ============================================================
   ARRANQUE
   ============================================================ */
(async function(){
  await cargar();
  /* si hay un inventario abierto en este local, se abre directamente */
  marcarNav(); render();
})();

/* acceso para pruebas */
window.__stock = { get P(){return P;}, get I(){return I;}, get M(){return M;}, get CFG(){return CFG;}, informeMes, leerParte };

})();
</script>

  });
